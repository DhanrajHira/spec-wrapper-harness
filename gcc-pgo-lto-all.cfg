# SPEC CPU2017: GCC PGO+LTO build config for integer and floating-point suites.
#
# Use a suite or benchmark selector on the runcpu command line, for example:
#   runcpu --config=gcc-pgo-lto-all.cfg --action=build intspeed
#   runcpu --config=gcc-pgo-lto-all.cfg --action=setup --size=ref --nobuild fprate

%ifndef %{build_ncpus}
%   define build_ncpus 96
%endif

action               = build
command_add_redirect = 1
feedback             = yes
flagsurl             = $[top]/config/flags/gcc.xml
ignore_errors        = 1
iterations           = 1
line_width           = 1020
log_line_width       = 1020
makeflags            = --jobs=%{build_ncpus}
mean_anyway          = 1
output_format        = txt,html,cfg,csv
preenv               = 1
reportable           = 0
size                 = test
teeout               = yes
train_single_thread  = yes
tune                 = peak

intspeed:
   label             = gcc-pgo-lto-intspeed
   threads           = 1
   EXTRA_OPTIMIZE    = -DSPEC_SUPPRESS_OPENMP

intrate:
   label             = gcc-pgo-lto-intrate
   copies            = 1
   EXTRA_OPTIMIZE    = -DSPEC_SUPPRESS_OPENMP

fpspeed:
   label             = gcc-pgo-lto-fpspeed
   threads           = 1
   EXTRA_OPTIMIZE    = -fopenmp -DSPEC_OPENMP
   preENV_OMP_STACKSIZE = 120M

fprate:
   label             = gcc-pgo-lto-fprate
   copies            = 1

default:
   CC                = gcc      -std=c99   -m64
   CXX               = g++      -std=c++03 -m64
   FC                = gfortran            -m64
   CC_VERSION_OPTION = -v
   CXX_VERSION_OPTION = -v
   FC_VERSION_OPTION = -v
   sw_base_ptrsize   = 64-bit
   sw_peak_ptrsize   = Not Applicable

default:
   EXTRA_PORTABILITY = -DSPEC_LP64

500.perlbench_r,600.perlbench_s:
   PORTABILITY       = -DSPEC_LINUX_X64

521.wrf_r,621.wrf_s:
   CPORTABILITY      = -DSPEC_CASE_FLAG
   FPORTABILITY      = -fconvert=big-endian

523.xalancbmk_r,623.xalancbmk_s:
   PORTABILITY       = -DSPEC_LINUX

526.blender_r:
   PORTABILITY       = -funsigned-char -DSPEC_LINUX

527.cam4_r,627.cam4_s:
   PORTABILITY       = -DSPEC_CASE_FLAG

628.pop2_s:
   CPORTABILITY      = -DSPEC_CASE_FLAG
   FPORTABILITY      = -fconvert=big-endian

default=peak:
   OPTIMIZE          = -g -O3 -fno-unsafe-math-optimizations -fno-tree-loop-vectorize
   EXTRA_LDFLAGS     = -static
   EXTRA_COPTIMIZE   = -fno-strict-aliasing -fgnu89-inline -fcommon
   EXTRA_FOPTIMIZE   = -fallow-argument-mismatch
   PASS1_OPTIMIZE    = -fprofile-generate
   PASS2_OPTIMIZE    = -flto=auto -fprofile-use -fprofile-correction -Wno-error=coverage-mismatch -Wno-error=missing-profile
