# SPEC CPU2026: GCC PGO+LTO build config for integer and floating-point suites.
#
# Ported from the CPU2017 version (gcc-pgo-lto-all.cfg):
#   - language standards bumped c99->c18 and c++03->c++17 (c++03 will not build
#     CPU2026's C++ benchmarks), Fortran pinned to f2018;
#   - benchmark PORTABILITY sections replaced with the CPU2026 set, taken from
#     $SPEC/config/Example-gcc-linux-x86.cfg.
# The PGO + LTO + static + BOLT-relocation recipe is unchanged.
#
# Use a suite or benchmark selector on the runcpu command line, for example:
#   runcpu --config=gcc-pgo-lto-all-2026.cfg --action=build intspeed
#   runcpu --config=gcc-pgo-lto-all-2026.cfg --action=setup --size=ref --nobuild fprate

%ifndef %{build_ncpus}
%   define build_ncpus 96
%endif

action               = build
command_add_redirect = 1
feedback             = yes
flagsurl             = $[top]/config/flags/gcc.xml
ignore_errors        = 1
iterations           = 1
line_width           = 1020
log_line_width       = 1020
makeflags            = --jobs=%{build_ncpus}
mean_anyway          = 1
output_format        = txt,html,cfg,csv
preenv               = 1
reportable           = 0
size                 = test
teeout               = yes
train_single_thread  = yes
tune                 = peak

intspeed:
   label             = gcc-pgo-lto-intspeed
   threads           = 1
   EXTRA_OPTIMIZE    = -DSPEC_SUPPRESS_OPENMP

intrate:
   label             = gcc-pgo-lto-intrate
   copies            = 1
   EXTRA_OPTIMIZE    = -DSPEC_SUPPRESS_OPENMP

fpspeed:
   label             = gcc-pgo-lto-fpspeed
   threads           = 1
   EXTRA_OPTIMIZE    = -fopenmp -DSPEC_OPENMP
   preENV_OMP_STACKSIZE = 120M

fprate:
   label             = gcc-pgo-lto-fprate
   copies            = 1

default:
   CC                = gcc      -std=c18    -m64
   CXX               = g++      -std=c++17  -m64
   FC                = gfortran -std=f2018  -m64
   CC_VERSION_OPTION = -v
   CXX_VERSION_OPTION = -v
   FC_VERSION_OPTION = -v
   sw_base_ptrsize   = 64-bit
   sw_peak_ptrsize   = Not Applicable

default:
   EXTRA_PORTABILITY = -DSPEC_LP64

#--------- CPU2026 portability (from config/Example-gcc-linux-x86.cfg) ---------
800.pot3d_s:
   PORTABILITY       = -DSPEC_SUPPRESS_LOCAL_AND_REDUCE

710.omnetpp_r:
   PORTABILITY       = -fno-finite-math-only

734.vpr_r,834.vpr_s:
   PORTABILITY       = -fno-finite-math-only

735.gem5_r,835.gem5_s:
   PORTABILITY       = -fno-finite-math-only

736.ocio_r:
   PORTABILITY       = -fno-finite-math-only

737.gmsh_r:
   PORTABILITY       = -fno-fast-math

748.flightdm_r:
   PORTABILITY       = -fno-fast-math

753.ns3_r,853.ns3_s:
   PORTABILITY       = -fno-finite-math-only

767.nest_r,867.nest_s:
   PORTABILITY       = -fno-finite-math-only
   PORTABILITY_LIBS  = -lstdc++fs

default=peak:
   OPTIMIZE          = -g -O3 -fno-unsafe-math-optimizations -fno-tree-loop-vectorize
   # Keep relocation and symbol information for post-link BOLT optimization.
   # --allow-multiple-definition: with -static, glibc's libc.a(getopt.o) and a
   # few benchmarks' bundled spec_getopt both define optind/optarg; take the
   # benchmark's (first on the link line).
   EXTRA_LDFLAGS     = -static -Wl,--emit-relocs -Wl,--discard-none -Wl,--allow-multiple-definition
   EXTRA_COPTIMIZE   = -fno-strict-aliasing -fgnu89-inline -fcommon
   EXTRA_FOPTIMIZE   = -fallow-argument-mismatch
   PASS1_OPTIMIZE    = -fprofile-generate
   PASS2_OPTIMIZE    = -flto=auto -fprofile-use -fprofile-correction -Wno-error=coverage-mismatch -Wno-error=missing-profile
